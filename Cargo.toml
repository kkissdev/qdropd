[workspace]
resolver = "2"
members = ["crates/qdrop-core", "crates/qdrop", "crates/qdropd"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Kevin Kiss <kevin@sysrex.com>"]
repository = "https://github.com/sysrex/qdropd"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rmp-serde = "1"
mdns-sd = "0.21"
fastrand = "2"
serde_json = "1"
serde_bytes = "0.11"
# Text only for M3 (no image-data); wlr-data-control on Wayland per the design.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
spake2 = "0.4"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
x509-parser = "0.18"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }

qdrop-core = { path = "crates/qdrop-core" }

[profile.release]
strip = true
lto = "thin"
