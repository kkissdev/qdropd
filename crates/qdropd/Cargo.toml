[package]
name = "qdropd"
description = "The qdrop daemon: discovery, transport, clipboard sync, and file transfer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "qdropd"
path = "src/main.rs"

[dependencies]
qdrop-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
mdns-sd.workspace = true
fastrand.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
arboard = { workspace = true, features = ["image-data"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSData"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
